<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:#0f172a;
            color:white;
        }

        .container{

            width:80%;
            margin:auto;
            text-align:center;
            padding-top:100px;
        }

        h1{
            font-size:50px;
        }

        p{
            font-size:20px;
            color:lightgray;
        }

        .card{

            background:#1e293b;
            padding:40px;
            border-radius:15px;
            margin-top:40px;
        }

        select{

            width:60%;
            padding:12px;
            margin-top:20px;
            border-radius:8px;
            font-size:16px;
        }

        button{

            margin-top:25px;
            padding:14px 30px;

            border:none;
            border-radius:8px;

            background:#3b82f6;
            color:white;

            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#2563eb;
        }

        .navbar{

            background:#1e293b;

            padding:15px 40px;

            display:flex;

            justify-content:space-between;

            align-items:center;
        }

        .navbar a{

            color:white;

            text-decoration:none;

            margin-left:20px;

            font-size:18px;
        }

        .navbar a:hover{

            color:#3b82f6;
        }

        .stats{

            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:40px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .stat-card{

            background:#1e293b;
            padding:25px;
            border-radius:15px;
            width:220px;
            text-align:center;
            box-shadow: 0 4px 10px rgba(0,0,0,0,1);
        }

        .stat-card h2{

            color:#22c55e;
        }

        .theme-btn{
            position:absolute;
            top:20px;
            right:20px;
            padding:10px 15px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            cursor:pointer;
        }

        .light-mode{
            background:#f8fafc !important;
            color:black !important;
        }

        .light-mode .card,
        .light-mode .stat-card{
            background:white !important;
            color:black !important;
        }

        .light-mode .sidebar{
            background:#e2e8f0 !important;
        }

        

        

    </style>

</head>

<body>


    <div class="navbar">

        

    <h2>AI Interview System</h2>

    <div>

        <a href="/">🏠 Home</a>

        <a href="/history">📊 History</a>

        <a href="/resume">📄 Upload Resume</a>


    </div>

    </div>

    <div class="stats",>

    <div class="stat-card">
        <h2>{{ total }}</h2>
        <p>Total Interviews</p>
    </div>

    <div class="stat-card">
        <h2>{{ highest }}</h2>
        <p>Highest Score</p>
    </div>

    <div class="stat-card">
        <h2>{{ average }}</h2>
        <p>Average Score</p>
    </div>

    </div>

    <div class="container">

        <h1>AI Interview Preparation System</h1>

        <p>Practice interviews with AI</p>

        <div class="card">

            <h2>Select Interview Topic</h2>

            <select>

                <option>Python</option>
                <option>Data Science</option>
                <option>Machine Learning</option>
                <option>SQL</option>

            </select>

            <br>

            <div class="card">

    <h2>Select Interview Topic</h2>

    <a href="/interview/python">
        <button>Python Interview</button>
    </a>

    <br><br>

    <a href="/interview/sql">
        <button>SQL Interview</button>
    </a>

    <br><br>

    <a href="/interview/hr">
        <button>HR Interview</button>
    </a>
    <br><br>
    
    

    <br><br>
</div>



</body>

</html>
