<!DOCTYPE html><html><head>
    <title>Resume Analyzer</title><style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
    }

    body{
        background:linear-gradient(135deg,#0f172a,#1e293b);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .container{
        background:white;
        width:500px;
        padding:40px;
        border-radius:20px;
        text-align:center;
        box-shadow:0 10px 25px rgba(0,0,0,0.3);
    }

    h1{
        color:#1e293b;
        margin-bottom:15px;
    }

    p{
        color:#64748b;
        margin-bottom:25px;
    }

    .upload-box{
        border:3px dashed #2563eb;
        padding:40px;
        border-radius:15px;
        margin-bottom:20px;
        background:#f8fafc;
    }

    input[type="file"]{
        margin-top:15px;
    }

    button{
        width:100%;
        padding:12px;
        background:#2563eb;
        color:white;
        border:none;
        border-radius:10px;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#1d4ed8;
    }

    .back-btn{
        display:inline-block;
        margin-top:15px;
        text-decoration:none;
        color:#2563eb;
        font-weight:bold;
    }

</style>

</head><body><div class="container">

    <h1>📄 AI Resume Analyzer</h1>

    <p>
        Upload your resume and get skill analysis,
        interview recommendations and AI insights.
    </p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <div class="upload-box">

            <h3>Choose Resume (PDF)</h3>

            <input
                type="file"
                name="resume"
                accept=".pdf"
                required
            >

        </div>

        <button type="submit">
            🚀 Analyze Resume
        </button>

    </form>

    <a href="/" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

</body></html>
